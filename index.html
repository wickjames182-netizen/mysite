<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiteCraft Multi-Tenant Hosting Cloud</title>
  <style>
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .box {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 1rem;
      border: 1px solid #334155;
      max-width: 520px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    h1 {
      color: #818cf8;
      margin-bottom: 0.5rem;
      font-size: 1.75rem;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      font-size: 1rem;
    }
    .badge {
      display: inline-block;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="badge">● Server Active</div>
    <h1>SiteCraft Cloud Hosting</h1>
    <p>This repository hosts automated multi-tenant business websites. Each store or business website is published live under its unique business slug URL.</p>
  </div>
</body>
</html>
